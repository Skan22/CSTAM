# UNTESTED example. Static config: the file provider watches live.json written by ipo-agent, and
# the API is bound to loopback only (the agent reads /api/http/routers on 127.0.0.1:8080).
entryPoints:
  web:
    address: ":80"
  traefik:
    address: "127.0.0.1:8080"
api:
  insecure: true   # serves the API on the "traefik" entry point, which is loopback only
providers:
  file:
    filename: /var/lib/ipo-agent/live.json
    watch: true
