# UNTESTED example. Track file drops priority by 100 when the agent asks for a fault.
vrrp_track_file ipo_fault {
    file /run/ipo/fault
    weight 1
}
vrrp_instance IPO_VIP {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 150
    advert_int 1
    virtual_ipaddress { 10.0.0.100 }
    track_file { ipo_fault weight 1 }
    notify_master "/usr/local/bin/ipo-vrrp-notify MASTER"
    notify_backup "/usr/local/bin/ipo-vrrp-notify BACKUP"
    notify_fault  "/usr/local/bin/ipo-vrrp-notify FAULT"
}
