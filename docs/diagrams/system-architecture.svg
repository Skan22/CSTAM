<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1110" viewBox="0 0 1720 1110" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15">
<defs><marker id="a-req" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#2f6fdd"/></marker><marker id="a-cfg" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#7a4fd6"/></marker><marker id="a-sig" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#c98a00"/></marker><marker id="a-tel" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#1a9c8b"/></marker><marker id="a-store" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#777"/></marker><marker id="a-ext" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#555"/></marker><marker id="a-bad" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#c24141"/></marker><marker id="a-ok" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#2f9e55"/></marker></defs>
<rect width="1720" height="1110" fill="#fff"/>
<text x="30" y="38" font-size="30" font-weight="700" fill="#1c1c3a">System architecture</text><text x="30" y="64" font-size="16" fill="#555">The platform on FelCloud OpenStack: one floating IP, a VRRP gateway pair, a control plane, isolated sandboxes.</text>
<rect x="670" y="84" width="340" height="58" rx="10" fill="#ffffff" stroke="#555" stroke-width="1.6"/>
<text x="840.0" y="102.5" text-anchor="middle" font-weight="700" font-size="17.1" fill="#222">Teams and visitors</text>
<text x="840.0" y="123.5" text-anchor="middle" font-size="14.8" fill="#222">https://team.cstam.felcloud.tn</text>
<rect x="1290" y="84" width="330" height="58" rx="10" fill="#ffffff" stroke="#555" stroke-width="1.6"/>
<text x="1455.0" y="102.5" text-anchor="middle" font-weight="700" font-size="17.1" fill="#222">Operators</text>
<text x="1455.0" y="123.5" text-anchor="middle" font-size="14.8" fill="#222">WireGuard, then SSH or the dashboard</text>
<rect x="20" y="170" width="1680" height="860" rx="14" fill="#ffffff" fill-opacity="0.35" stroke="#555" stroke-width="1.4"/>
<text x="36" y="197" font-size="19.4" text-anchor="start" fill="#222" font-weight="700">FelCloud OpenStack, region North-Africa</text>
<rect x="620" y="215" width="440" height="560" rx="14" fill="#e8f1ff" fill-opacity="0.35" stroke="#2f6fdd" stroke-width="1.4"/>
<text x="636" y="242" font-size="19.4" text-anchor="start" fill="#10294d" font-weight="700">edge-net 10.0.0.0/24</text>
<text x="636" y="264" font-size="14.2" text-anchor="start" fill="#10294d">behind r-edge</text>
<rect x="680" y="280" width="320" height="64" rx="10" fill="#e8f1ff" stroke="#2f6fdd" stroke-width="1.6"/>
<text x="840.0" y="301.5" text-anchor="middle" font-weight="700" font-size="17.1" fill="#10294d">VIP 10.0.0.100 + floating IP</text>
<text x="840.0" y="322.5" text-anchor="middle" font-size="14.8" fill="#10294d">held by the MASTER</text>
<rect x="640" y="390" width="400" height="118" rx="10" fill="#e8f1ff" stroke="#2f6fdd" stroke-width="1.6"/>
<text x="840.0" y="417.5" text-anchor="middle" font-weight="700" font-size="17.1" fill="#10294d">gw-a   VRRP MASTER (priority 150)</text>
<text x="840.0" y="438.5" text-anchor="middle" font-size="14.8" fill="#10294d">keepalived: VRRP, Traefik health check</text>
<text x="840.0" y="459.5" text-anchor="middle" font-size="14.8" fill="#10294d">Traefik: routes by Host, hot-reloaded config</text>
<text x="840.0" y="480.5" text-anchor="middle" font-size="14.8" fill="#10294d">ipo-agent: verifies signed config, reports</text>
<rect x="640" y="590" width="400" height="118" rx="10" fill="#e8f1ff" stroke="#2f6fdd" stroke-width="1.6"/>
<text x="840.0" y="617.5" text-anchor="middle" font-weight="700" font-size="17.1" fill="#10294d">gw-b   VRRP BACKUP (priority 100)</text>
<text x="840.0" y="638.5" text-anchor="middle" font-size="14.8" fill="#10294d">same stack, same routes, same signed config</text>
<text x="840.0" y="659.5" text-anchor="middle" font-size="14.8" fill="#10294d">takes the VIP in about a second when gw-a fails</text>
<text x="840.0" y="680.5" text-anchor="middle" font-size="14.8" fill="#10294d">nopreempt: does not hand it back</text>
<path d="M840,142 L840,280" fill="none" stroke="#2f6fdd" stroke-width="2.2" marker-end="url(#a-req)"/>
<text x="858" y="160" font-size="14.2" text-anchor="start" fill="#10294d">80 / 443</text>
<path d="M840,344 L840,390" fill="none" stroke="#2f6fdd" stroke-width="2.2" marker-end="url(#a-req)"/>
<path d="M840,508 L840,590" fill="none" stroke="#c98a00" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a-sig)"/>
<text x="856" y="556" font-size="14.2" text-anchor="start" fill="#4d3300">VRRP adverts, unicast, every 0.2 s</text>
<rect x="40" y="215" width="520" height="560" rx="14" fill="#e8f8ec" fill-opacity="0.35" stroke="#2f9e55" stroke-width="1.4"/>
<text x="56" y="242" font-size="19.4" text-anchor="start" fill="#0f3a1d" font-weight="700">sandbox-net 10.20.0.0/24</text>
<text x="56" y="264" font-size="14.2" text-anchor="start" fill="#0f3a1d">DHCP off; Neutron's pool equals the control plane's IPAM range</text>
<rect x="80" y="290" width="440" height="100" rx="10" fill="#e8f8ec" stroke="#2f9e55" stroke-width="1.6"/>
<text x="300.0" y="319.0" text-anchor="middle" font-weight="700" font-size="17.1" fill="#0f3a1d">Team sandbox VMs</text>
<text x="300.0" y="340.0" text-anchor="middle" font-size="14.8" fill="#0f3a1d">one fixed IP per lease, port security on</text>
<text x="300.0" y="361.0" text-anchor="middle" font-size="14.8" fill="#0f3a1d">reachable only from the gateways, on port 80</text>
<rect x="80" y="450" width="440" height="90" rx="10" fill="#e0f7f4" stroke="#1a9c8b" stroke-width="1.6"/>
<text x="300.0" y="474.0" text-anchor="middle" font-weight="700" font-size="17.1" fill="#08413a">Relay</text>
<text x="300.0" y="495.0" text-anchor="middle" font-size="14.8" fill="#08413a">OTLP and syslog from sandboxes, per-source rate limits</text>
<text x="300.0" y="516.0" text-anchor="middle" font-size="14.8" fill="#08413a">forwards to the observability host</text>
<rect x="80" y="600" width="440" height="100" rx="10" fill="#e8f8ec" stroke="#2f9e55" stroke-width="1.6"/>
<text x="300.0" y="629.0" text-anchor="middle" font-weight="700" font-size="17.1" fill="#0f3a1d">Warm pool</text>
<text x="300.0" y="650.0" text-anchor="middle" font-size="14.8" fill="#0f3a1d">booted VMs parked on reserved addresses</text>
<text x="300.0" y="671.0" text-anchor="middle" font-size="14.8" fill="#0f3a1d">a registration claims one in seconds</text>
<path d="M640,449 L592,449 L592,340 L520,340" fill="none" stroke="#2f6fdd" stroke-width="2.2" marker-end="url(#a-req)"/>
<text x="580" y="395" transform="rotate(-90 580 395)" font-size="14.2" text-anchor="middle" fill="#10294d">route by Host</text>
<path d="M300,390 L300,450" fill="none" stroke="#1a9c8b" stroke-width="2.2" marker-end="url(#a-tel)"/>
<text x="316" y="424" font-size="14.2" text-anchor="start" fill="#08413a">telemetry</text>
<rect x="1140" y="215" width="540" height="800" rx="14" fill="#f1eaff" fill-opacity="0.35" stroke="#7a4fd6" stroke-width="1.4"/>
<text x="1156" y="242" font-size="19.4" text-anchor="start" fill="#2a1457" font-weight="700">mgmt-net 10.30.0.0/24</text>
<text x="1156" y="264" font-size="14.2" text-anchor="start" fill="#2a1457">behind r-mgmt, entered via the bastion</text>
<rect x="1180" y="275" width="460" height="66" rx="10" fill="#fff4d6" stroke="#c98a00" stroke-width="1.6"/>
<text x="1410.0" y="297.5" text-anchor="middle" font-weight="700" font-size="17.1" fill="#4d3300">Bastion</text>
<text x="1410.0" y="318.5" text-anchor="middle" font-size="14.8" fill="#4d3300">WireGuard on UDP 51820, the only way in</text>
<rect x="1170" y="370" width="480" height="230" rx="14" fill="#f1eaff" fill-opacity="0.35" stroke="#7a4fd6" stroke-width="1.4"/>
<text x="1186" y="397" font-size="19.4" text-anchor="start" fill="#2a1457" font-weight="700">Control plane: cp-1 and cp-2</text>
<rect x="1190" y="420" width="440" height="62" rx="10" fill="#f1eaff" stroke="#7a4fd6" stroke-width="1.6"/>
<text x="1410.0" y="440.5" text-anchor="middle" font-weight="700" font-size="17.1" fill="#2a1457">API and dashboard</text>
<text x="1410.0" y="461.5" text-anchor="middle" font-size="14.8" fill="#2a1457">FastAPI behind Caddy, one HTTPS origin</text>
<rect x="1190" y="500" width="440" height="84" rx="10" fill="#f1eaff" stroke="#7a4fd6" stroke-width="1.6"/>
<text x="1410.0" y="521.0" text-anchor="middle" font-weight="700" font-size="17.1" fill="#2a1457">Workers and controllers</text>
<text x="1410.0" y="542.0" text-anchor="middle" font-size="14.8" fill="#2a1457">sagas, config compiler, pool manager, reaper,</text>
<text x="1410.0" y="563.0" text-anchor="middle" font-size="14.8" fill="#2a1457">reconciler; leaders elected with advisory locks</text>
<rect x="1180" y="620" width="460" height="66" rx="10" fill="#f4f4f4" stroke="#777" stroke-width="1.6"/>
<text x="1410.0" y="642.5" text-anchor="middle" font-weight="700" font-size="17.1" fill="#222">PostgreSQL: primary cp-1, replica cp-2</text>
<text x="1410.0" y="663.5" text-anchor="middle" font-size="14.8" fill="#222">all state; nightly dumps to object storage</text>
<rect x="1180" y="702" width="460" height="62" rx="10" fill="#fff4d6" stroke="#c98a00" stroke-width="1.6"/>
<text x="1410.0" y="722.5" text-anchor="middle" font-weight="700" font-size="17.1" fill="#4d3300">step-ca on cp-1</text>
<text x="1410.0" y="743.5" text-anchor="middle" font-size="14.8" fill="#4d3300">private CA: 24 h host certificates, auto-renewed</text>
<rect x="1180" y="780" width="460" height="80" rx="10" fill="#e0f7f4" stroke="#1a9c8b" stroke-width="1.6"/>
<text x="1410.0" y="799.0" text-anchor="middle" font-weight="700" font-size="17.1" fill="#08413a">Observability on cp-2</text>
<text x="1410.0" y="820.0" text-anchor="middle" font-size="14.8" fill="#08413a">Prometheus, Alertmanager, Loki, Tempo, Grafana</text>
<text x="1410.0" y="841.0" text-anchor="middle" font-size="14.8" fill="#08413a">(Grafana served under /grafana/ by the same front)</text>
<rect x="1180" y="890" width="460" height="80" rx="10" fill="#ffffff" stroke="#555" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="1410.0" y="909.0" text-anchor="middle" font-weight="700" font-size="17.1" fill="#222">OpenStack APIs</text>
<text x="1410.0" y="930.0" text-anchor="middle" font-size="14.8" fill="#222">Nova, Neutron, Keystone: create and delete sandbox</text>
<text x="1410.0" y="951.0" text-anchor="middle" font-size="14.8" fill="#222">VMs and ports with an application credential</text>
<path d="M1455,142 L1455,275" fill="none" stroke="#c98a00" stroke-width="2.2" marker-end="url(#a-sig)"/>
<text x="1470" y="214" font-size="14.2" text-anchor="start" fill="#4d3300">WireGuard</text>
<path d="M1590,341 L1590,420" fill="none" stroke="#c98a00" stroke-width="2.2" marker-end="url(#a-sig)"/>
<text x="1576" y="362" font-size="14.2" text-anchor="end" fill="#4d3300">SSH, dashboard, API</text>
<path d="M1040,435 L1190,435" fill="none" stroke="#1a9c8b" stroke-width="2.2" marker-end="url(#a-tel)"/>
<text x="1115.0" y="425.0" text-anchor="middle" font-size="14.2" fill="#08413a">heartbeat, traffic</text>
<path d="M1100,470 L1040,470" fill="none" stroke="#7a4fd6" stroke-width="2.2" marker-end="url(#a-cfg)"/>
<path d="M1100,640 L1040,640" fill="none" stroke="#7a4fd6" stroke-width="2.2" marker-end="url(#a-cfg)"/>
<path d="M1190,545 L1100,545 L1100,470" fill="none" stroke="#7a4fd6" stroke-width="2.2" marker-end="url(#a-cfg)"/>
<path d="M1100,545 L1100,640" fill="none" stroke="#7a4fd6" stroke-width="2.2" marker-end="url(#a-cfg)"/>
<text x="1100" y="676" font-size="13.7" text-anchor="middle" fill="#2a1457">signed</text>
<text x="1100" y="693" font-size="13.7" text-anchor="middle" fill="#2a1457">config,</text>
<text x="1100" y="710" font-size="13.7" text-anchor="middle" fill="#2a1457">mTLS, to</text>
<text x="1100" y="727" font-size="13.7" text-anchor="middle" fill="#2a1457">both</text>
<text x="1100" y="744" font-size="13.7" text-anchor="middle" fill="#2a1457">gateways</text>
<path d="M1640,560 L1665,560 L1665,930 L1640,930" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a-ext)"/>
<path d="M300,700 L300,840 L1180,840" fill="none" stroke="#1a9c8b" stroke-width="2.2" marker-end="url(#a-tel)"/>
<path d="M840,708 L840,840" fill="none" stroke="#1a9c8b" stroke-width="2.2" marker-end="url(#a-tel)"/>
<text x="330" y="830" font-size="14.2" text-anchor="start" fill="#08413a">metrics and logs from every host (Alloy), and sandbox telemetry via the relay</text>
<rect x="50" y="1048" width="1620" height="40" rx="8" fill="#fafafa" stroke="#ddd"/>
<text x="66" y="1074" font-size="14.2" font-weight="700" fill="#444">Key</text>
<rect x="118" y="1059" width="26" height="18" rx="4" fill="#e8f1ff" stroke="#2f6fdd" stroke-width="1.6"/>
<text x="152" y="1074" font-size="14.2" fill="#333">gateways</text>
<rect x="231" y="1059" width="26" height="18" rx="4" fill="#e8f8ec" stroke="#2f9e55" stroke-width="1.6"/>
<text x="265" y="1074" font-size="14.2" fill="#333">sandboxes</text>
<rect x="351" y="1059" width="26" height="18" rx="4" fill="#f1eaff" stroke="#7a4fd6" stroke-width="1.6"/>
<text x="385" y="1074" font-size="14.2" fill="#333">control plane</text>
<rect x="501" y="1059" width="26" height="18" rx="4" fill="#e0f7f4" stroke="#1a9c8b" stroke-width="1.6"/>
<text x="535" y="1074" font-size="14.2" fill="#333">telemetry</text>
<rect x="621" y="1059" width="26" height="18" rx="4" fill="#fff4d6" stroke="#c98a00" stroke-width="1.6"/>
<text x="655" y="1074" font-size="14.2" fill="#333">access and certificates</text>
<rect x="845" y="1059" width="26" height="18" rx="4" fill="#f4f4f4" stroke="#777" stroke-width="1.6"/>
<text x="879" y="1074" font-size="14.2" fill="#333">database</text>
<path d="M958,1068 L992,1068" stroke="#555" stroke-width="2.2" marker-end="url(#a-ext)"/>
<text x="1002" y="1074" font-size="14.2" fill="#333">request or API call</text>
<path d="M1162,1068 L1196,1068" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a-ext)"/>
<text x="1206" y="1074" font-size="14.2" fill="#333">standby or control link</text>
</svg>