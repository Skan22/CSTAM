[project]
name = "ipo-control-plane"
version = "0.1.0"
description = "Resilient IP Optimizer control plane"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
  "pyyaml>=6",
  "jsonschema>=4.22",
  "alembic>=1.20.0",
  "sqlalchemy>=2.1.1",
  "cryptography>=50.0.1",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11", "types-pyyaml", "types-jsonschema"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ipo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["ipo", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
