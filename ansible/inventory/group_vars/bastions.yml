---
# The bastion is the one host that forwards: WireGuard peers to the mgmt-net ports that
# sg-bastion is allowed to reach, masqueraded (roles/bastion), so the cloud sees the bastion.
bastion_wg_cidr: 10.99.0.0/24
hardening_sysctl_extra:
  net.ipv4.ip_forward: 1
# For the first run only: the address range that may SSH to the bastion before WireGuard works
# (the same one Pulumi's `ipo:bootstrapSshFrom` opens in the security group). Empty afterwards.
bootstrap_ssh_from: ""
hardening_extra_input: >-
  {{ ['iifname "wg0" ip saddr ' ~ bastion_wg_cidr ~ ' tcp dport 22 accept']
     + (['ip saddr ' ~ bootstrap_ssh_from ~ ' tcp dport 22 accept'] if bootstrap_ssh_from else []) }}
hardening_extra_forward:
  - "ct state established,related accept"
  - >-
    iifname "wg0" ip saddr {{ bastion_wg_cidr }} ip daddr {{ ipo_platform.network.mgmt_cidr }}
    tcp dport { 22, 8000 } accept
