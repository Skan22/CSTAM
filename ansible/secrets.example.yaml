# Shape of the secrets the roles read as `ipo_secrets`. Keep the real file SOPS-encrypted
# (secrets.enc.yaml) and decrypt it next to this one, as secrets.yaml (git-ignored), for a run:
#   sops -d secrets.enc.yaml > secrets.yaml && ansible-playbook playbooks/site.yml -e @secrets.yaml
# tests/deploy renders every role with these placeholder values.
ipo_secrets:
  # Control plane
  admin_password: "change-me-admin-0000"
  jwt_secret: "change-me-at-least-32-bytes-of-random-0000"
  # Ed25519 seed (base64) the control plane signs configs with, and its public half for the agents.
  signing_private_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
  signing_public_key: "O2onvM62pC1io6jQKm8Nc2UyFXcd4kOmOsBIoYtZ2ik="
  # One login per gateway agent (operator role), created at start from IPO_USERS_FILE.
  agent_passwords:
    gw-a: "change-me-agent-a-0000"
    gw-b: "change-me-agent-b-0000"
  # The control plane's OpenStack application credential, as a clouds.yaml body.
  clouds_yaml: |
    clouds:
      felcloud:
        auth_type: v3applicationcredential
        auth:
          auth_url: https://keystone.felcloud.tn:5000/v3
          application_credential_id: "0000"
          application_credential_secret: "change-me"
        region_name: RegionOne
  # Postgres
  postgres_password: "change-me-postgres-0000"
  replication_password: "change-me-replication-0000"
  app_db_password: "change-me-app-0000"
  # Nightly dumps (optional): an rclone remote and its configuration.
  backup_remote: "swift:ipo-backups/dev"
  rclone_config: |
    [swift]
    type = swift
    env_auth = false
    auth = https://keystone.felcloud.tn:5000/v3
    application_credential_id = 0000
    application_credential_secret = change-me
  # Platform CA (step-ca) key and provisioner password.
  ca_password: "change-me-ca-0000"
  # Observability
  grafana_admin_password: "change-me-grafana-0000"
  alert_webhook: ""
