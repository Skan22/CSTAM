---
- name: Look for an existing data directory
  ansible.builtin.command:
    argv: [podman, run, --rm, -v, "postgres:/var/lib/postgresql", "{{ postgres_image }}",
           sh, -c, 'test -s "$PGDATA/PG_VERSION"']
  register: postgres_has_data
  failed_when: postgres_has_data.rc not in [0, 1]
  changed_when: false
  become: true
  become_user: "{{ ipo_service_user }}"

- name: Copy the primary with pg_basebackup (it writes standby.signal and primary_conninfo)
  ansible.builtin.command:
    argv: [podman, run, --rm, --network, host, --user, postgres,
           -v, "postgres:/var/lib/postgresql",
           --secret, "ipo-replication-password,type=env,target=PGPASSWORD",
           "{{ postgres_image }}", sh, -ec, "{{ postgres_basebackup }}"]
  vars:
    postgres_basebackup: >-
      mkdir -p "$PGDATA" && chmod 0700 "$PGDATA" &&
      exec pg_basebackup -h {{ postgres_primary_ip }} -U replicator -D "$PGDATA" -R -X stream
      -C -S {{ inventory_hostname | replace('-', '_') }}
  when: postgres_has_data.rc != 0
  changed_when: true
  become: true
  become_user: "{{ ipo_service_user }}"
