---
# Creates or replaces one Podman secret for the service user, only when its value changed: the
# secret carries a label with the value's hash. Callers set podman_secret_name and
# podman_secret_value, and podman_secret_notify to name the handler that restarts its users.
- name: Read the stored hash of secret {{ podman_secret_name }}
  ansible.builtin.command:
    argv: [podman, secret, inspect, --format, "{{ '{{' }}index .Spec.Labels \"ipo.sha256\"{{ '}}' }}",
           "{{ podman_secret_name }}"]
  register: podman_secret_current
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ podman_user }}"

- name: Store secret {{ podman_secret_name }}
  ansible.builtin.command:
    argv: [podman, secret, create, --replace, --label, "ipo.sha256={{ podman_secret_value | hash('sha256') }}",
           "{{ podman_secret_name }}", "-"]
    stdin: "{{ podman_secret_value }}"
    stdin_add_newline: false
  when: podman_secret_current.stdout | trim != podman_secret_value | hash('sha256')
  changed_when: true
  no_log: true
  # Containers read a secret when they start, so the caller's restart handler must run.
  notify: "{{ podman_secret_notify | default([]) }}"
  become: true
  become_user: "{{ podman_user }}"
