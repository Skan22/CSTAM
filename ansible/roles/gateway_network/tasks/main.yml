---
- name: Install the edge routing unit
  ansible.builtin.template:
    src: ipo-edge-routing.service.j2
    dest: /etc/systemd/system/ipo-edge-routing.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart edge routing

- name: Enable edge routing
  ansible.builtin.systemd_service:
    name: ipo-edge-routing.service
    enabled: true
    state: started
    daemon_reload: true
