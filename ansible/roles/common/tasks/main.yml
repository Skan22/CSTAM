---
- name: Send apt through the egress proxy (FelCloud's routers do not SNAT)
  ansible.builtin.copy:
    content: |
      // Managed by Ansible (role common).
      Acquire::http::Proxy "{{ ipo_egress_proxy }}";
      Acquire::https::Proxy "{{ ipo_egress_proxy }}";
    dest: /etc/apt/apt.conf.d/90-ipo-proxy
    owner: root
    group: root
    mode: "0644"
  when: ansible_facts['os_family'] == 'Debian' and ipo_egress_proxy | length > 0

- name: Refresh the package index (a fresh image has none)
  # Always: an index fetched while the network was not yet usable is empty but looks fresh, and then
  # apt "knows" no package at all. Refreshing it is not a change to the host.
  ansible.builtin.apt:
    update_cache: true
  changed_when: false
  when: ansible_facts['os_family'] == 'Debian'

- name: Install the base packages
  ansible.builtin.package:
    name: "{{ common_packages }}"
    state: present

- name: Pin package versions
  ansible.builtin.template:
    src: apt-pins.j2
    dest: /etc/apt/preferences.d/90-ipo
    owner: root
    group: root
    mode: "0644"
  when: ansible_facts['os_family'] == 'Debian' and common_package_pins | length > 0

- name: Keep the clock synchronised
  ansible.builtin.systemd_service:
    name: "{{ 'chronyd' if ansible_facts['os_family'] == 'RedHat' else 'chrony' }}"
    enabled: true
    state: started

- name: Make room for the journald drop-in
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Cap the journal
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf.d/90-ipo.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald

- name: Create the group that may read this host's key (roles/step_ca fills the directory)
  ansible.builtin.group:
    name: "{{ common_pki_group }}"
    system: true

# In the key's group from the start: the user's systemd manager, and every rootless container it
# runs, keeps the groups the user had when lingering started it, and restarting a manager with
# containers running wedges them (both found on the first real deploy).
- name: Create the service user that runs the containers
  ansible.builtin.user:
    name: "{{ common_service_user }}"
    system: true
    home: "{{ common_service_home }}"
    create_home: true
    shell: /usr/sbin/nologin
    groups: ["{{ common_pki_group }}"]
    append: true

- name: Create operator accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: ["{{ common_admin_group }}"]
    append: true
    shell: /bin/bash
  loop: "{{ common_operators }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create operators' SSH directories
  ansible.builtin.file:
    path: "/home/{{ item.name }}/.ssh"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0700"
  loop: "{{ common_operators }}"
  loop_control:
    label: "{{ item.name }}"

- name: Authorise operators' SSH keys (and only those)
  ansible.builtin.template:
    src: authorized_keys.j2
    dest: "/home/{{ item.name }}/.ssh/authorized_keys"
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0600"
  loop: "{{ common_operators }}"
  loop_control:
    label: "{{ item.name }}"

- name: Let operators use sudo
  ansible.builtin.template:
    src: sudoers.j2
    dest: /etc/sudoers.d/90-ipo-operators
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  when: common_operators | length > 0
