---
- name: Install the firewall and audit packages
  ansible.builtin.package:
    name: "{{ hardening_packages[ansible_facts['os_family']] | default(hardening_packages['Debian']) }}"
    state: present

- name: Write the sysctl baseline
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: /etc/sysctl.d/90-ipo.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply sysctl

- name: Restrict SSH
  ansible.builtin.template:
    src: sshd_ipo.conf.j2
    dest: /etc/ssh/sshd_config.d/90-ipo.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Make room for tables other roles own
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Render the firewall mirroring the security groups
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: "{{ hardening_nft_path }}"
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload nftables

- name: Enable the firewall and auditd
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [nftables, auditd]

- name: Look for SELinux
  ansible.builtin.stat:
    path: /etc/selinux/config
  register: hardening_selinux_config

# Debian, the platform's base image, ships AppArmor rather than SELinux; on a distribution that
# has SELinux it is kept enforcing.
- name: Keep SELinux enforcing
  ansible.builtin.lineinfile:
    path: /etc/selinux/config
    regexp: "^SELINUX="
    line: "SELINUX={{ hardening_selinux_state }}"
    mode: "0644"
  when: hardening_selinux_config.stat.exists
  notify: Enforce SELinux now
