---
- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Reload sshd
  ansible.builtin.systemd_service:
    name: sshd
    state: reloaded

- name: Enforce SELinux now
  ansible.builtin.command: setenforce {{ 'Enforcing' if hardening_selinux_state == 'enforcing' else 'Permissive' }}
  changed_when: true
  failed_when: false
