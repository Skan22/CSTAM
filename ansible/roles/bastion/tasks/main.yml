---
- name: Install WireGuard
  ansible.builtin.package:
    name: wireguard-tools
    state: present

- name: Generate the server key once
  ansible.builtin.shell:
    cmd: set -o pipefail && umask 077 && wg genkey > /etc/wireguard/private.key
    executable: /bin/bash
    creates: /etc/wireguard/private.key

- name: Read the server's public key
  ansible.builtin.shell:
    cmd: set -o pipefail && wg pubkey < /etc/wireguard/private.key
    executable: /bin/bash
  register: bastion_public_key
  changed_when: false

- name: Write the WireGuard interface
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart WireGuard

- name: Masquerade WireGuard peers onto mgmt-net
  ansible.builtin.template:
    src: bastion.nft.j2
    dest: /etc/nftables.d/bastion.nft
    owner: root
    group: root
    mode: "0600"
  notify: Reload nftables

- name: Run WireGuard
  ansible.builtin.systemd_service:
    name: wg-quick@wg0
    enabled: true
    state: started

- name: Install the egress proxy
  ansible.builtin.package:
    name: tinyproxy
    state: present

- name: Configure the egress proxy and its allow-list
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - {src: tinyproxy.conf.j2, dest: /etc/tinyproxy/tinyproxy.conf}
    - {src: egress-allow.j2, dest: /etc/tinyproxy/egress-allow}
  loop_control:
    label: "{{ item.dest }}"
  notify: Restart the egress proxy

- name: Run the egress proxy
  ansible.builtin.systemd_service:
    name: tinyproxy
    enabled: true
    state: started

- name: Tell the operator what peers need
  ansible.builtin.debug:
    msg: >-
      Peers use PublicKey = {{ bastion_public_key.stdout }}, Endpoint = <bastion floating IP>:{{ bastion_wg_port }},
      AllowedIPs = {{ ipo_platform.network.mgmt_cidr }}.
